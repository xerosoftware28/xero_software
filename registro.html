<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - XERO</title>
   
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <h1>XERO</h1>
            <p>Crea tu cuenta para comenzar</p>
        </div>

        <form action="index.html" class="auth-form">
            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Crea una contraseña" required>
            </div>
            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn-auth">Registrarse</button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a></p>
        </div>
    </div>

</body>
</html>
